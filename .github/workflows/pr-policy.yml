name: PR policy

# Enforces docs/pr-policy.md. Runs on pull_request_target so it can comment on PRs from forks;
# only the base branch's code is executed — the PR's commits are fetched as git data and never run.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check PR against policy
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/pr-policy/check.mjs \
            --base "$BASE_SHA" \
            --head pr/head \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --report "$RUNNER_TEMP/pr-policy-report.md"

      - name: Comment policy report
        if: always() && steps.check.outcome != 'skipped'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-policy
          path: ${{ runner.temp }}/pr-policy-report.md
